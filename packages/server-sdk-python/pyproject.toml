[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompthash-server-sdk"
version = "0.1.0"
description = "Server-side Python SDK for the Prompt Mint API: API-key auth, idempotent writes, typed error codes, retries, and webhook verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "PromptHash Stellar contributors" }]
keywords = [
  "prompthash",
  "promptmint",
  "stellar",
  "soroban",
  "sdk",
  "webhooks",
  "idempotency",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PromptMintLabs/prompt-mint"
Documentation = "https://github.com/PromptMintLabs/prompt-mint/blob/main/docs/integration-guide.md"
Issues = "https://github.com/PromptMintLabs/prompt-mint/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompthash_server_sdk = ["py.typed"]
