name: Deploy - Frontend to Vercel and Artifacts

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build frontend
        run: yarn build
        env:
          CI: true

      - name: Generate frontend checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} \; > ../frontend-checksums.txt
          sha256sum ../frontend-checksums.txt > ../frontend-checksums.txt.sha256

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Upload frontend checksums
        uses: actions/upload-artifact@v7
        with:
          name: frontend-checksums-${{ github.sha }}
          path: |
            frontend-checksums.txt
            frontend-checksums.txt.sha256
          retention-days: 30

      - name: Deploy to Vercel
        uses: vercel/action@v5
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  contract-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: \~/.cargo/registry
          key: \( {{ runner.os }}-cargo-registry- \){{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: \~/.cargo/git
          key: \( {{ runner.os }}-cargo-git- \){{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: \( {{ runner.os }}-cargo-build-target- \){{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Build contract
        run: cargo build --release -p prompt-hash --target wasm32-unknown-unknown
        env:
          CARGO_TERM_COLOR: always

      - name: List WASM artifacts
        run: ls -lah target/wasm32-unknown-unknown/release/*.wasm

      - name: Generate WASM checksums
        run: |
          cd target/wasm32-unknown-unknown/release
          sha256sum *.wasm > ../../../wasm-checksums.txt
          sha256sum ../../../wasm-checksums.txt > ../../../wasm-checksums.txt.sha256

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contract-wasm-${{ github.sha }}
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30

      - name: Upload WASM checksums
        uses: actions/upload-artifact@v7
        with:
          name: wasm-checksums-${{ github.sha }}
          path: |
            wasm-checksums.txt
            wasm-checksums.txt.sha256
          retention-days: 30

  production-smoke-test:
    name: Verify production health endpoints
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://promptmint.io' }}
        run: |
          set -euo pipefail
          for endpoint in /api/health /api/status; do
            file="health$(echo "$endpoint" | tr '/' '_').json"
            curl --fail --silent --show-error --retry 5 --retry-delay 5 \
              --retry-all-errors --max-time 20 "${PRODUCTION_URL}${endpoint}" -o "$file"
          done

      - name: Upload health responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-health-${{ github.sha }}
          path: health*.json
          if-no-files-found: warn
          retention-days: 7

  sign-artifacts:
    needs: [contract-build, deploy-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: contract-wasm-${{ github.sha }}
          path: ./artifacts/wasm

      - name: Download WASM checksums
        uses: actions/download-artifact@v8
        with:
          name: wasm-checksums-${{ github.sha }}
          path: ./artifacts

      - name: Download frontend checksums
        uses: actions/download-artifact@v8
        with:
          name: frontend-checksums-${{ github.sha }}
          path: ./artifacts

      - name: Generate deploy manifest
        # Paths are flat basenames so the manifest verifies against a
        # `gh release download` directory. See docs/deploy-manifest.md.
        run: |
          mkdir -p manifest-staging
          cp ./artifacts/wasm/*.wasm ./artifacts/frontend-checksums.txt manifest-staging/
          cd manifest-staging
          node ../scripts/deploy-manifest.mjs generate \
            --network release \
            --wasm prompt_hash.wasm \
            --artifact frontend-checksums.txt \
            --out ../artifacts/deploy-manifest.json

      - name: Create combined checksum manifest
        run: |
          cat ./artifacts/wasm-checksums.txt ./artifacts/frontend-checksums.txt > ./artifacts/release-checksums.txt
          (cd ./artifacts && sha256sum deploy-manifest.json) >> ./artifacts/release-checksums.txt
          echo "" >> ./artifacts/release-checksums.txt
          echo "# Release ${{ github.sha }}" >> ./artifacts/release-checksums.txt
          echo "# Build timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ./artifacts/release-checksums.txt
          echo "# Repository: ${{ github.repository }}" >> ./artifacts/release-checksums.txt
          echo "# Workflow: ${{ github.workflow }}" >> ./artifacts/release-checksums.txt
          echo "# Run ID: ${{ github.run_id }}" >> ./artifacts/release-checksums.txt
          sha256sum ./artifacts/release-checksums.txt > ./artifacts/release-checksums.txt.sha256

      - name: Sign checksums with cosign
        run: |
          cosign sign-blob \
            --yes \
            --bundle ./artifacts/release-checksums.txt.sig \
            ./artifacts/release-checksums.txt

      - name: Sign WASM artifacts with cosign
        run: |
          for wasm in ./artifacts/wasm/*.wasm; do
            cosign sign-blob \
              --yes \
              --bundle "${wasm}.sig" \
              "$wasm"
          done

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./artifacts/wasm/*.wasm
            ./artifacts/release-checksums.txt

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-${{ github.sha }}
          path: |
            ./artifacts/release-checksums.txt
            ./artifacts/release-checksums.txt.sha256
            ./artifacts/release-checksums.txt.sig
            ./artifacts/deploy-manifest.json
            ./artifacts/frontend-checksums.txt
            ./artifacts/wasm/*.wasm
            ./artifacts/wasm/*.wasm.sig
          retention-days: 90

  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install CycloneDX tooling
        run: npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate frontend SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          cyclonedx-npm --output-format JSON --output-file sbom/frontend-sbom.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate contract SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          cd contracts
          cargo cyclonedx --output ../sbom/contract-sbom.json 2>/dev/null || echo "{\"warning\":\"cargo-cyclonedx not available for contract crate\",\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > ../sbom/contract-sbom.json

      - name: Generate server SBOM
        run: |
          mkdir -p sbom
          cd server
          npx -y @cyclonedx/cyclonedx-npm --output-format JSON --output-file ../sbom/server-sbom.json 2>/dev/null || echo "{\"warning\":\"cyclonedx-npm not available for server\",\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > ../sbom/server-sbom.json

      - name: Create SBOM manifest
        run: |
          mkdir -p sbom
          jq -n \
            --arg sha "${{ github.sha }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo "${{ github.repository }}" \
            --arg run_id "${{ github.run_id }}" \
            '{release: $sha, generatedAt: $ts, repository: $repo, runId: $run_id, sbomFiles: ["frontend-sbom.json","contract-sbom.json","server-sbom.json"]}' \
            > sbom/sbom-manifest.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90

  create-release:
    needs: [sign-artifacts, contract-build, generate-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read

    steps:
      - uses: actions/checkout@v7

      - name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: signed-release-${{ github.sha }}
          path: ./signed-release

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'

      # Gate the release on provenance: the deploy workflow badge in README and
      # docs/artifact-verification.md is only green when this step passes.
      - name: Verify deployment provenance
        run: |
          set -euo pipefail
          mkdir -p flat
          find signed-release -type f -exec cp {} flat/ \;
          cosign verify-blob \
            --bundle flat/release-checksums.txt.sig \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            flat/release-checksums.txt
          (cd flat && grep ' deploy-manifest.json$' release-checksums.txt | sha256sum -c -)
          node scripts/deploy-manifest.mjs verify --manifest flat/deploy-manifest.json --root flat
          node scripts/deploy-manifest.mjs badge --manifest flat/deploy-manifest.json --root flat \
            --out signed-release/provenance-badge.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.sha }}
          name: Deploy ${{ github.sha }}
          body: |
            Automated release from **Deploy - Frontend to Vercel and Artifacts**.

            - Frontend deployed to Vercel production
            - Signed WASM + checksum artifacts
            - `deploy-manifest.json` with artifact hashes (verified before publishing)
            - SBOM attached when available

            See [artifact-verification.md](./docs/artifact-verification.md) and [deploy-manifest.md](./docs/deploy-manifest.md).
          draft: false
          prerelease: false
          files: |
            signed-release/**
            sbom/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
